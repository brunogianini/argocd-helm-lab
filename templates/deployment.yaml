apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meuapp.fullname" . }}
  labels:
    {{- include "meuapp.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "meuapp.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "meuapp.labels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"

          ports:
            - containerPort: {{ .Values.service.port }}

          volumeMounts:
{{ toYaml .Values.volumeMounts | nindent 12 }}

      volumes:
{{ toYaml .Values.volumes | nindent 8 }}
